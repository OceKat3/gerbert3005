services:    

  dev:
    image: ruby:3.3
    network_mode: host
    working_dir: /3005
    volumes:
      - .:/3005:cached
    command: bash -c "bundle install && sleep infinity"

  postgres:
    image: postgres:latest
    network_mode: host
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
  
  pgadmin:
    image: dpage/pgadmin4
    network_mode: host
    environment:
      PGADMIN_DEFAULT_EMAIL: a@b.c
      PGADMIN_DEFAULT_PASSWORD: gerb